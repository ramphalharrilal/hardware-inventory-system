name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify project
        run: mvn --batch-mode verify

      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-inventory-system
          path: target/hardware-inventory-system-*.jar
          if-no-files-found: error
